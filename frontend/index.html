<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nutrition Assistant</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/DaysTabs.css" />
    <link rel="stylesheet" href="/src/styles/RecipeCard.css" />
    <link rel="stylesheet" href="/src/styles/RecipeCatalog.css" />
    <link rel="stylesheet" href="/src/styles/main-layout.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header" id="header">
        <a class="logo" href="#header">Nutrition Assistant</a>
        <nav class="nav">
          <a href="#calculator">Калькулятор</a>
          <a href="#goals">Цели</a>
          <a href="#menu">Меню</a>
        </nav>
      </header>

      <section class="banner" id="banner">
        <h1>Питание под вашу цель</h1>
        <p>Рассчитайте норму калорий и составьте меню на неделю</p>
        <a class="banner__button" href="#menu">Подобрать меню</a>
      </section>

      <section class="block" id="calculator">
        <h2>Калькулятор КБЖУ</h2>
        <p class="placeholder">Здесь будет калькулятор</p>
      </section>

      <section class="block" id="goals">
        <h2>Выбор цели</h2>
        <p class="placeholder">Здесь будет слайдер целей</p>
      </section>

      <section class="block" id="menu">
        <div id="days-tabs" class="days-tabs-container"></div>

        <h2 id="day-title" class="day-title"></h2>

        <div class="recipe-catalog">
          <div class="recipe-catalog__controls">
            <select id="sort-by">
              <option value="">Без сортировки</option>
              <option value="calories">Калории</option>
              <option value="proteins">Белки</option>
              <option value="fats">Жиры</option>
              <option value="carbs">Углеводы</option>
            </select>
            <select id="sort-order">
              <option value="asc">По возрастанию</option>
              <option value="desc">По убыванию</option>
            </select>
          </div>
          <p id="status"></p>
          <div id="recipe-list" class="recipe-catalog__list"></div>
        </div>
      </section>

      <footer class="site-footer" id="footer">
        <p>Nutrition Assistant, 2026</p>
        <nav class="nav">
          <a href="#header">Наверх</a>
        </nav>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
